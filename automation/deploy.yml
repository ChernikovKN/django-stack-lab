
---
- name: Manage Django stack
  hosts: lab
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    project_dir: "{{ playbook_dir | dirname }}"

  tasks:
    - name: Ensure Docker Compose services are running
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        wait: true
        wait_timeout: 90

    - name: Check Django health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8899/health/
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: health_result

    - name: Print application health
      ansible.builtin.debug:
        var: health_result.json
