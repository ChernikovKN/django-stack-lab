
---
- name: Manage Django stack
  hosts: lab
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    project_dir: "{{ playbook_dir | dirname }}"

  tasks:

    - name: Copy staging Compose configuration
      ansible.builtin.copy:
        src: "{{ project_dir }}/ci/compose.staging.yaml"
        dest: "{{ stage_dir }}/compose.staging.yaml"
        mode: "0644"

    - name: Copy staging Nginx configuration
      ansible.builtin.copy:
        src: "{{ project_dir }}/ci/nginx.staging.conf"
        dest: "{{ stage_dir }}/nginx.staging.conf"
        mode: "0644"


    - name: Ensure Docker Compose services are running
      community.docker.docker_compose_v2:
        project_src: "{{ stage_dir }}"
        state: present
        wait: true
        wait_timeout: 90

    - name: Check Django health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8899/health/
        method: GET
        status_code: 200
        return_content: true
        timeout: 10
      register: health_result

    - name: Print application health
      ansible.builtin.debug:
        var: health_result.json
