
---
- name: Rollback Django staging
  hosts: lab
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    project_dir: "{{ playbook_dir | dirname }}"

    stage_env:
      CI_IMAGE: "{{ lookup('env', 'CI_IMAGE') }}"
      DB_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') }}"
      DJANGO_SECRET_KEY: "{{ lookup('env', 'DJANGO_SECRET_KEY') }}"

  tasks:
    - name: Verify rollback configuration
      ansible.builtin.assert:
        that:
          - stage_env.CI_IMAGE | length > 0
          - stage_env.DB_PASSWORD | length > 0
          - stage_env.DJANGO_SECRET_KEY | length > 0
      no_log: true

    - name: Check previous image exists
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "{{ stage_env.CI_IMAGE }}"
      changed_when: false
      no_log: true

    - name: Restore previous application image
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}/ci"
        files:
          - compose.staging.yaml
        project_name: django-ci-staging
        state: present
        build: never
        pull: never
        wait: true
        wait_timeout: 120
      environment: "{{ stage_env }}"
      no_log: true

    - name: Verify restored application health
      ansible.builtin.uri:
        url: http://127.0.0.1:8900/health/
        status_code: 200
        return_content: true
      register: health_result
      retries: 6
      delay: 2
      until: health_result.status == 200

    - name: Print health result
      ansible.builtin.debug:
        var: health_result.json
