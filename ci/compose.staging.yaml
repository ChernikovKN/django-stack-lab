
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stage_db
      POSTGRES_USER: stage_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - stage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${CI_IMAGE:?required}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?required}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: stage_db
      DB_USER: stage_user
      DB_PASSWORD: ${DB_PASSWORD:?required}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8900:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  stage_pgdata:
